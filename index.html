<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>選股數據報表</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; }
h1 { font-size: 1.4rem; padding: 20px 24px 8px; color: #f8fafc; }
.subtitle { padding: 0 24px 20px; color: #64748b; font-size: 12px; }
.stats { display: flex; gap: 12px; padding: 0 24px 20px; flex-wrap: wrap; }
.stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 14px 20px; min-width: 120px; }
.stat-card .label { color: #94a3b8; font-size: 11px; margin-bottom: 4px; }
.stat-card .value { font-size: 1.4rem; font-weight: 700; color: #f1f5f9; }
.section { padding: 0 24px 28px; }
h2 { font-size: 1rem; color: #94a3b8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
.table-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid #1e293b; }
table { width: 100%; border-collapse: collapse; }
thead th { background: #1e293b; color: #64748b; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; padding: 10px 12px; white-space: nowrap; position: sticky; top: 0; }
tbody tr:hover { background: #1e293b; }
tbody td { padding: 9px 12px; border-bottom: 1px solid #1e293b; white-space: nowrap; color: #cbd5e1; }
.small-table { max-width: 500px; }
</style>
</head>
<body>
<h1>📊 選股判斷數據庫</h1>
<p class="subtitle">生成時間：2026-06-04 ｜ 資料來源：logs/judgments.db</p>

<div class="stats">
    <div class="stat-card"><div class="label">總篩選記錄</div><div class="value">0</div></div>
    <div class="stat-card"><div class="label">已有回報數據</div><div class="value">0</div></div>
    <div class="stat-card"><div class="label">平均 1 日回報</div><div class="value" style="color:#ef4444">+0.00%</div></div>
    <div class="stat-card"><div class="label">平均 5 日回報</div><div class="value" style="color:#ef4444">+0.00%</div></div>
    <div class="stat-card"><div class="label">5日勝率</div><div class="value" style="color:#ef4444">0%</div></div>
    <div class="stat-card"><div class="label">勝/負（有結果）</div><div class="value">0 / 0</div></div>
</div>

<div class="section">
    <h2>量能分桶 vs 5日期望值</h2>
    <div class="table-wrap small-table">
        <table>
            <thead><tr><th>量能區間</th><th>樣本數</th><th>平均5日</th><th>勝率</th></tr></thead>
            <tbody><tr><td colspan='4' style='color:#64748b;text-align:center'>尚無足夠數據</td></tr></tbody>
        </table>
    </div>
</div>

<div class="section">
    <h2>所有選股記錄（共 0 筆）</h2>
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>日期</th><th>代號</th><th>名稱</th><th>類型</th>
                    <th>收盤</th><th>進場</th>
                    <th>籌碼分</th><th>RSI5</th><th>RSI14</th><th>量比</th><th>MA20</th>
                    <th>新聞</th><th>歷史分</th><th>觸發</th>
                    <th>1日回報</th><th>3日回報</th><th>5日回報</th><th>10日回報</th>
                </tr>
            </thead>
            <tbody>
                <tr><td colspan='18' style='color:#64748b;text-align:center;padding:20px'>尚無記錄</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
